<!doctype html>
<meta charset="utf-8">
<style>
  :root {
    --bg:      #0d1117;
    --chrome:  #161b22;
    --border:  #30363d;
    --text:    #c9d1d9;
    --dim:     #8b949e;
    --yellow:  #d29922;
    --green:   #3fb950;
    --prompt:  #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 675px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 30% 20%, #1c2430 0%, #0a0d12 70%);
    font-family: "DejaVu Sans Mono", ui-monospace, monospace;
  }
  .window {
    width: 1110px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03);
  }
  .titlebar {
    height: 46px; background: var(--chrome);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 18px; gap: 9px;
  }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
  .title {
    flex: 1; text-align: center; color: var(--dim);
    font-size: 15px; letter-spacing: .3px; margin-left: -60px;
  }
  .body { padding: 32px 36px 38px; }
  .line {
    white-space: pre; font-size: 25px; line-height: 1.68; color: var(--text);
  }
  .gap { height: 16px; }
  .prompt { color: var(--prompt); }
  .cmd    { color: #ffffff; }
  .dim    { color: var(--dim); }
  .yellow { color: var(--yellow); }
  .green  { color: var(--green); }
  .cursor {
    display: inline-block; width: 12px; height: 25px;
    background: var(--text); vertical-align: -4px; margin-left: 4px;
  }
</style>
<div class="window"><div class="titlebar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">cc &mdash; claude-account-switcher</span></div><div class="body"><div class="line"><span class="prompt">$</span> <span class="cmd">cc</span></div><div class="line"><span class="dim">[cc] personal · you@personal.com</span></div><div class="line"><span class="dim">     ...working...</span></div><div class="line"><span class="dim">[cc] </span><span class="yellow">personal hit its limit · resets 15:40</span></div><div class="line"><span class="dim">[cc] carrying the conversation over (24M)...</span></div><div class="line"><span class="dim">[cc] </span><span class="green">switching to work — same conversation</span></div><div class="line"><span class="dim">[cc] work · you@work.com</span></div><div class="gap"></div><div class="line"><span class="prompt">$</span><span class="cursor"></span></div></div></div>
